# Builds the Eden S26 APK from eden-s26/patches. Manual trigger only.
name: Build Eden S26

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;30.0.16248370" "cmake;3.31.5" "platforms;android-36" "build-tools;36.0.0"

      - name: Build
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          WORK="$RUNNER_TEMP/eden" ./eden-s26/build-s26.sh

      - uses: actions/upload-artifact@v4
        with:
          name: eden-s26-apk
          path: ${{ runner.temp }}/eden/artifacts/*.apk
